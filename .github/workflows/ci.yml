name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests dashboard packaging scripts

      - name: Verify the installation
        run: titlei verify

      - name: Test
        run: pytest --cov=titlei --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run the guided demo
        run: titlei demo --out outputs/demo

      - name: Run the model end to end
        run: titlei report --out outputs -v

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: allocation-report
          path: |
            outputs/report.html
            outputs/charts
            outputs/tables
